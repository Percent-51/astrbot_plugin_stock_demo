name: 冒烟回归

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 语法检查
        run: python -m py_compile main.py

      - name: 冒烟回归（89 条断言）
        run: python tests/冒烟回归.py
